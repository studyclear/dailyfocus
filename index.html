<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student To-Do List</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    html {
      height: 100%;
    }

    * {
      box-sizing: border-box;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #667eea;
      margin: 0 0 10px 0;
      font-size: 2.5em;
      font-weight: 700;
    }

    .header p {
      color: #6b7280;
      margin: 0;
      font-size: 1.1em;
    }

    .input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .task-input {
      flex: 1;
      padding: 15px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    .task-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .priority-select {
      padding: 15px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1em;
      background: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .priority-select:focus {
      outline: none;
      border-color: #667eea;
    }

    .add-btn {
      padding: 15px 30px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .add-btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .add-btn:active {
      transform: translateY(0);
    }

    .add-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      background: #f3f4f6;
      border: 2px solid transparent;
      border-radius: 10px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .filter-btn:hover {
      background: #e5e7eb;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .tasks-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: #f9fafb;
      padding: 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .task-item:hover {
      background: #f3f4f6;
      transform: translateX(5px);
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .task-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .task-text {
      font-size: 1.05em;
      color: #1f2937;
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .task-meta {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .priority-badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 0.75em;
      font-weight: 600;
      text-transform: uppercase;
    }

    .priority-high {
      background: #fee2e2;
      color: #dc2626;
    }

    .priority-medium {
      background: #fef3c7;
      color: #d97706;
    }

    .priority-low {
      background: #dbeafe;
      color: #2563eb;
    }

    .task-date {
      font-size: 0.8em;
      color: #9ca3af;
    }

    .delete-btn {
      padding: 8px 16px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .delete-btn:hover {
      background: #dc2626;
      transform: scale(1.05);
    }

    .delete-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
    }

    .empty-state-icon {
      font-size: 4em;
      margin-bottom: 20px;
    }

    .empty-state-text {
      font-size: 1.2em;
      font-weight: 500;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #e5e7eb;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2em;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 0.9em;
      color: #6b7280;
      font-weight: 500;
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .limit-warning {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #92400e;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 500;
    }

    @media (max-width: 640px) {
      .container {
        padding: 25px;
      }

      .header h1 {
        font-size: 2em;
      }

      .input-section {
        flex-direction: column;
      }

      .filters {
        justify-content: center;
      }

      .stats {
        flex-direction: column;
        gap: 20px;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="container">
   <div class="header">
    <h1 id="app-title">📚 Daftar Tugas Pelajar</h1>
    <p id="subtitle">Kelola tugas dan tingkatkan produktivitasmu!</p>
   </div>
   <div id="limit-warning" class="limit-warning" style="display: none;">
    ⚠️ Batas maksimum 999 tugas telah tercapai. Hapus beberapa tugas terlebih dahulu.
   </div>
   <div class="input-section"><input type="text" id="task-input" class="task-input" placeholder="Masukkan tugas baru..." maxlength="200"> <select id="priority-select" class="priority-select"> <option value="low">Rendah</option> <option value="medium" selected>Sedang</option> <option value="high">Tinggi</option> </select> <button id="add-btn" class="add-btn"> <span id="add-btn-text">➕ Tambah</span> </button>
   </div>
   <div class="filters"><button class="filter-btn active" data-filter="all">Semua</button> <button class="filter-btn" data-filter="active">Aktif</button> <button class="filter-btn" data-filter="completed">Selesai</button> <button class="filter-btn" data-filter="high">Prioritas Tinggi</button>
   </div>
   <div id="tasks-list" class="tasks-list"></div>
   <div class="stats">
    <div class="stat-item">
     <div class="stat-number" id="total-tasks">
      0
     </div>
     <div class="stat-label">
      Total Tugas
     </div>
    </div>
    <div class="stat-item">
     <div class="stat-number" id="active-tasks">
      0
     </div>
     <div class="stat-label">
      Aktif
     </div>
    </div>
    <div class="stat-item">
     <div class="stat-number" id="completed-tasks">
      0
     </div>
     <div class="stat-label">
      Selesai
     </div>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      app_title: "📚 Daftar Tugas Pelajar",
      subtitle: "Kelola tugas dan tingkatkan produktivitasmu!",
      add_button_text: "➕ Tambah",
      background_color: "#667eea",
      surface_color: "#ffffff",
      text_color: "#1f2937",
      primary_action_color: "#667eea",
      secondary_action_color: "#ef4444",
      font_family: "Segoe UI",
      font_size: 16
    };

    let allTasks = [];
    let currentFilter = 'all';
    let isOperationInProgress = false;

    const dataHandler = {
      onDataChanged(data) {
        allTasks = data;
        renderTasks();
        updateStats();
        updateLimitWarning();
      }
    };

    async function initializeApp() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error("Failed to initialize data SDK");
      }

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          onConfigChange: async (config) => {
            const appTitle = document.getElementById('app-title');
            const subtitle = document.getElementById('subtitle');
            const addBtnText = document.getElementById('add-btn-text');
            const body = document.body;
            const container = document.querySelector('.container');
            const taskTexts = document.querySelectorAll('.task-text');
            const addBtn = document.getElementById('add-btn');
            const deleteBtns = document.querySelectorAll('.delete-btn');

            const customFont = config.font_family || defaultConfig.font_family;
            const baseFontStack = 'Tahoma, Geneva, Verdana, sans-serif';
            const baseSize = config.font_size || defaultConfig.font_size;

            appTitle.textContent = config.app_title || defaultConfig.app_title;
            appTitle.style.fontFamily = ${customFont}, ${baseFontStack};
            appTitle.style.fontSize = ${baseSize * 2.5}px;

            subtitle.textContent = config.subtitle || defaultConfig.subtitle;
            subtitle.style.fontFamily = ${customFont}, ${baseFontStack};
            subtitle.style.fontSize = ${baseSize * 1.1}px;

            addBtnText.textContent = config.add_button_text || defaultConfig.add_button_text;

            body.style.background = linear-gradient(135deg, ${config.background_color || defaultConfig.background_color} 0%, #764ba2 100%);
            container.style.background = config.surface_color || defaultConfig.surface_color;

            taskTexts.forEach(text => {
              text.style.color = config.text_color || defaultConfig.text_color;
              text.style.fontFamily = ${customFont}, ${baseFontStack};
              text.style.fontSize = ${baseSize * 1.05}px;
            });

            addBtn.style.background = config.primary_action_color || defaultConfig.primary_action_color;
            
            deleteBtns.forEach(btn => {
              btn.style.background = config.secondary_action_color || defaultConfig.secondary_action_color;
            });

            document.querySelectorAll('.stat-number').forEach(stat => {
              stat.style.color = config.primary_action_color || defaultConfig.primary_action_color;
            });

            document.querySelectorAll('.filter-btn.active').forEach(btn => {
              btn.style.background = config.primary_action_color || defaultConfig.primary_action_color;
              btn.style.borderColor = config.primary_action_color || defaultConfig.primary_action_color;
            });
          },
          mapToCapabilities: (config) => ({
            recolorables: [
              {
                get: () => config.background_color || defaultConfig.background_color,
                set: (value) => {
                  config.background_color = value;
                  window.elementSdk.setConfig({ background_color: value });
                }
              },
              {
                get: () => config.surface_color || defaultConfig.surface_color,
                set: (value) => {
                  config.surface_color = value;
                  window.elementSdk.setConfig({ surface_color: value });
                }
              },
              {
                get: () => config.text_color || defaultConfig.text_color,
                set: (value) => {
                  config.text_color = value;
                  window.elementSdk.setConfig({ text_color: value });
                }
              },
              {
                get: () => config.primary_action_color || defaultConfig.primary_action_color,
                set: (value) => {
                  config.primary_action_color = value;
                  window.elementSdk.setConfig({ primary_action_color: value });
                }
              },
              {
                get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                set: (value) => {
                  config.secondary_action_color = value;
                  window.elementSdk.setConfig({ secondary_action_color: value });
                }
              }
            ],
            borderables: [],
            fontEditable: {
              get: () => config.font_family || defaultConfig.font_family,
              set: (value) => {
                config.font_family = value;
                window.elementSdk.setConfig({ font_family: value });
              }
            },
            fontSizeable: {
              get: () => config.font_size || defaultConfig.font_size,
              set: (value) => {
                config.font_size = value;
                window.elementSdk.setConfig({ font_size: value });
              }
            }
          }),
          mapToEditPanelValues: (config) => new Map([
            ["app_title", config.app_title || defaultConfig.app_title],
            ["subtitle", config.subtitle || defaultConfig.subtitle],
            ["add_button_text", config.add_button_text || defaultConfig.add_button_text]
          ])
        });
      }
    }

    function updateLimitWarning() {
      const warning = document.getElementById('limit-warning');
      if (allTasks.length >= 999) {
        warning.style.display = 'block';
      } else {
        warning.style.display = 'none';
      }
    }

    function renderTasks() {
      const tasksList = document.getElementById('tasks-list');
      const filteredTasks = getFilteredTasks();

      if (filteredTasks.length === 0) {
        tasksList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-text">Belum ada tugas. Tambahkan tugas pertamamu!</div>
          </div>
        `;
        return;
      }

      tasksList.innerHTML = '';
      filteredTasks.forEach(task => {
        const taskElement = createTaskElement(task);
        tasksList.appendChild(taskElement);
      });
    }

    function createTaskElement(task) {
      const div = document.createElement('div');
      div.className = task-item ${task.completed ? 'completed' : ''};
      div.dataset.taskId = task.id;

      const priorityLabels = {
        high: 'Tinggi',
        medium: 'Sedang',
        low: 'Rendah'
      };

      const date = new Date(task.createdAt);
      const formattedDate = date.toLocaleDateString('id-ID', { 
        day: 'numeric', 
        month: 'short',
        hour: '2-digit',
        minute: '2-digit'
      });

      div.innerHTML = `
        <input 
          type="checkbox" 
          class="task-checkbox" 
          ${task.completed ? 'checked' : ''}
          data-task-id="${task.id}"
        >
        <div class="task-content">
          <div class="task-text">${escapeHtml(task.text)}</div>
          <div class="task-meta">
            <span class="priority-badge priority-${task.priority}">${priorityLabels[task.priority]}</span>
            <span class="task-date">${formattedDate}</span>
          </div>
        </div>
        <button class="delete-btn" data-task-id="${task.id}">🗑️ Hapus</button>
      `;

      const checkbox = div.querySelector('.task-checkbox');
      checkbox.addEventListener('change', () => toggleTask(task));

      const deleteBtn = div.querySelector('.delete-btn');
      deleteBtn.addEventListener('click', () => deleteTask(task));

      return div;
    }

    function getFilteredTasks() {
      let filtered = [...allTasks];

      switch(currentFilter) {
        case 'active':
          filtered = filtered.filter(t => !t.completed);
          break;
        case 'completed':
          filtered = filtered.filter(t => t.completed);
          break;
        case 'high':
          filtered = filtered.filter(t => t.priority === 'high');
          break;
      }

      return filtered.sort((a, b) => {
        const priorityOrder = { high: 0, medium: 1, low: 2 };
        if (a.completed !== b.completed) {
          return a.completed ? 1 : -1;
        }
        return priorityOrder[a.priority] - priorityOrder[b.priority];
      });
    }

    async function addTask() {
      if (isOperationInProgress) return;

      const input = document.getElementById('task-input');
      const prioritySelect = document.getElementById('priority-select');
      const addBtn = document.getElementById('add-btn');
      const text = input.value.trim();

      if (!text) return;

      if (allTasks.length >= 999) {
        return;
      }

      isOperationInProgress = true;
      addBtn.disabled = true;
      addBtn.innerHTML = '<span class="loading-spinner"></span>';

      const newTask = {
        id: Date.now().toString() + Math.random().toString(36).substr(2, 9),
        text: text,
        completed: false,
        priority: prioritySelect.value,
        createdAt: new Date().toISOString()
      };

      const result = await window.dataSdk.create(newTask);

      if (result.isOk) {
        input.value = '';
        prioritySelect.value = 'medium';
      }

      isOperationInProgress = false;
      addBtn.disabled = false;
      addBtn.innerHTML = <span id="add-btn-text">${window.elementSdk?.config?.add_button_text || defaultConfig.add_button_text}</span>;
    }

    async function toggleTask(task) {
      if (isOperationInProgress) return;

      isOperationInProgress = true;
      const checkbox = document.querySelector(input[data-task-id="${task.id}"]);
      const originalState = checkbox.checked;
      checkbox.disabled = true;

      const updatedTask = { ...task, completed: !task.completed };
      const result = await window.dataSdk.update(updatedTask);

      if (!result.isOk) {
        checkbox.checked = originalState;
      }

      checkbox.disabled = false;
      isOperationInProgress = false;
    }

    async function deleteTask(task) {
      if (isOperationInProgress) return;

      isOperationInProgress = true;
      const deleteBtn = document.querySelector(button[data-task-id="${task.id}"]);
      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<span class="loading-spinner"></span>';

      const result = await window.dataSdk.delete(task);

      if (!result.isOk) {
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = '🗑️ Hapus';
      }

      isOperationInProgress = false;
    }

    function updateStats() {
      const total = allTasks.length;
      const active = allTasks.filter(t => !t.completed).length;
      const completed = allTasks.filter(t => t.completed).length;

      document.getElementById('total-tasks').textContent = total;
      document.getElementById('active-tasks').textContent = active;
      document.getElementById('completed-tasks').textContent = completed;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('add-btn').addEventListener('click', addTask);
    document.getElementById('task-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    initializeApp();
  </script>
